[project]
name = "terminal-workspace"
version = "1.0.0"
description = "Terminal Workspace: All-in-one Cyber Threat Intel Dashboard, Anti-Inertia Workflow & Desktop Enhancements"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Le Tuan" }
]
keywords = [
    "kubuntu",
    "kde-plasma",
    "textual",
    "tui",
    "threat-intel",
    "cyber-security",
    "dashboard",
    "pomodoro",
    "workspace"
]
dependencies = [
    "textual>=0.70.0"
]

[project.urls]
Homepage = "https://github.com/letuan/terminal-workspace"
Repository = "https://github.com/letuan/terminal-workspace.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
